<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Yearbook Scoreboard · Winterhouse Season II</title>
<script src="content.js"></script>
<style>
  @font-face { font-family: Vibes; src: url(fonts/GreatVibes-Regular.ttf); font-display: swap; }
  @font-face { font-family: Bebas; src: url(fonts/BebasNeue.woff2) format('woff2'); }
  @font-face { font-family: Lato; src: url(fonts/Lato-400.woff2) format('woff2'); font-weight: 400; }
  @font-face { font-family: Lato; src: url(fonts/Lato-400i.woff2) format('woff2'); font-weight: 400; font-style: italic; }
  @font-face { font-family: Lato; src: url(fonts/Lato-700.woff2) format('woff2'); font-weight: 700; }
  @font-face { font-family: Lato; src: url(fonts/Lato-900.woff2) format('woff2'); font-weight: 900; }
  :root { --navy: #01295B; --ink: #172A4D; --blue: #3D97DB; --sky: #86BAF0; --pale: #E3EEFA; --slate: #5E7FA3; --paper: #F7F5F0; --line: #DCE3EC; --ok: #1F8A70; --bad: #E0574B; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 17px/1.4 Lato, Helvetica, Arial, sans-serif; }
  main { max-width: 1000px; margin: 0 auto; padding: 24px 22px 60px; }
  .hd { display: flex; align-items: flex-end; gap: 22px; margin-bottom: 8px; }
  .hd img { width: 120px; }
  .kicker { font-size: 14px; font-weight: 900; color: var(--navy); }
  .kicker span { font-weight: 400; color: var(--slate); }
  h1 { font-family: Vibes, cursive; font-weight: 400; font-size: 66px; line-height: 1.1; color: var(--navy); margin: 0; }
  .sect { display: flex; align-items: center; gap: 12px; margin: 14px 0 16px; }
  .sect i { flex: 1; height: 8px; background: var(--blue); }
  .bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 14px; color: var(--slate); }
  button, input { font: inherit; }
  .btn { font-family: Bebas, Impact, sans-serif; font-size: 20px; letter-spacing: .04em; padding: 8px 16px 6px; border-radius: 8px; border: 0; background: var(--navy); color: #fff; cursor: pointer; }
  .btn.gold { background: var(--blue); }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(1,41,91,.05); }
  .row { display: grid; grid-template-columns: 64px 1fr auto; gap: 16px; align-items: center; }
  .place { font-family: Bebas, Impact, sans-serif; font-size: 60px; color: var(--blue); text-align: center; line-height: .9; }
  .team { font-family: Bebas, Impact, sans-serif; font-size: 30px; color: var(--navy); line-height: 1; }
  .names { color: var(--slate); font-size: 15px; margin-top: 2px; }
  .total { text-align: right; }
  .total b { font-family: Bebas, Impact, sans-serif; font-weight: 400; font-size: 64px; display: block; line-height: .9; color: var(--navy); }
  .total span { font-size: 12px; color: var(--slate); font-weight: 700; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip { font-size: 13px; font-weight: 700; padding: 4px 10px; border-radius: 6px; background: #F0F2F5; color: #8A97A8; }
  .chip.done { background: var(--pale); color: var(--navy); }
  .chip.mem.ok { background: #E2F3EE; color: var(--ok); }
  .chip.mem.no { background: #FBE9E7; color: var(--bad); }
  .status { font-size: 13px; color: var(--slate); margin-top: 6px; }
  .gate { max-width: 360px; margin: 30px 0; }
  .gate input { width: 100%; padding: 11px 12px; border: 1.5px solid var(--line); border-radius: 8px; margin: 10px 0; font-size: 17px; }
  .err { color: var(--bad); font-size: 14px; }
  details { margin-top: 8px; font-size: 14px; }
  details li { margin: 2px 0; }
  .r { color: var(--ok); font-weight: 700; } .w { color: var(--bad); font-weight: 700; }
  .fake { border-left: 8px solid var(--bad); }
  .fake .lab { font-family: Bebas, Impact, sans-serif; font-size: 22px; color: var(--bad); }
</style>
</head>
<body>
<main id="app"></main>
<script>
const ENDPOINT = 'https://winterhouse-survey.ryanapanela.workers.dev';
const ROUNDS = [['timeline', 'Timeline'], ['rendezvous', 'Rendezvous'], ['who', 'Who’s in It?'], ['zoom', 'Zoom In'], ['hear', 'Hear It'], ['caption', 'Caption']];
const params = new URLSearchParams(location.search);
const pilot = params.has('pilot');
let key = params.get('k') || (() => { try { return localStorage.getItem('wh-yb-gm') || ''; } catch (e) { return ''; } })();
let reveal = false, data = null, err = '', last = null;
const app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function items(t, k) { return k === 'hear' ? YB.hear : YB.teams[t][k]; }
function correct(t, k, i, v) {
  const it = items(t, k)[i];
  if (k === 'who') {
    const truth = it.names, picked = new Set((v || []).filter(Boolean));
    const hits = truth.filter(n => picked.has(n)).length;
    return hits >= truth.length - (truth.length >= 3 ? 1 : 0);
  }
  return v === it.a;
}
function grade(t, d) {
  const out = { rounds: [], total: 0, max: 0, done: 0 };
  for (const [k, label] of ROUNDS) {
    const n = items(t, k).length, locked = !!(d.locked || {})[k], a = (d.ans || {})[k] || {};
    let s = 0; const detail = [];
    for (let i = 0; i < n; i++) { const ok = a[i] !== undefined && correct(t, k, i, a[i]); if (ok) s++; detail.push(ok); }
    const ans = k === 'who' ? Object.values(a).filter(v => (v || []).some(Boolean)).length : Object.keys(a).length;
    out.rounds.push({ k, label, n, s, locked, detail, ans });
    out.max += n; if (locked) { out.total += s; out.done++; }
  }
  const flagged = ((d.ans || {}).memory || {})[0];
  out.memLocked = !!(d.locked || {}).memory;
  out.flagged = flagged;
  out.memOk = flagged === YB.teams[t].fake;
  return out;
}

const HEAD = (sub) => `<div class="hd"><img src="logo.png" alt="Winterhouse II"><div><div class="kicker">Winterhouse II · Mission 3 <span>· The Yearbook${pilot ? ' · PILOT' : ''}</span></div><h1>Scoreboard</h1></div></div><div class="sect"><i></i>${sub || ''}</div>`;
function gate(msg) {
  app.innerHTML = HEAD('') + `
    <div class="gate card"><div>Enter the GM key</div><input id="k" autocomplete="off" value="${esc(key)}"><button class="btn" id="go">Open</button>
    ${msg ? `<p class="err">${esc(msg)}</p>` : ''}</div>`;
  const go = () => { key = document.getElementById('k').value.trim(); try { localStorage.setItem('wh-yb-gm', key); } catch (e) {} fetchData(); };
  document.getElementById('go').onclick = go;
  document.getElementById('k').onkeydown = e => { if (e.key === 'Enter') go(); };
}

async function fetchData() {
  if (!key) return gate('');
  try {
    const r = await fetch(ENDPOINT + '/yb/results', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ k: key, pilot }) });
    const j = await r.json();
    if (r.status === 403) return gate('That key didn’t work.');
    if (!r.ok) throw new Error(j.error || r.status);
    try { localStorage.setItem('wh-yb-gm', key); } catch (e) {}
    data = j.teams; err = ''; last = new Date();
  } catch (e) { err = 'Couldn’t refresh: ' + (e.message || e); }
  draw();
}

function draw() {
  if (!data) return;
  const rows = ['1', '2', '3', '4', '5'].map(t => ({ t, d: data[t], g: data[t] ? grade(t, data[t]) : null }));
  rows.sort((a, b) => ((b.g ? b.g.total + (reveal && b.g.memOk ? 1 : 0) : -1) - (a.g ? a.g.total + (reveal && a.g.memOk ? 1 : 0) : -1)) || (+a.t - +b.t));
  const anyDone = rows.some(r => r.d && r.d.final);
  app.innerHTML = HEAD(`<div class="bar"><span>${last ? 'Updated ' + last.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', second: '2-digit' }) + ' · refreshes every 15 s' : ''}</span>
      <button class="btn" id="ref">Refresh</button>
      <button class="btn gold" id="rev">${reveal ? 'Hide the fake' : 'Reveal the fake memory'}</button></div>`) + `    ${err ? `<p class="err" style="text-align:center">${esc(err)}</p>` : ''}
    ${reveal ? `<div class="card fake"><div class="lab">The fake memory</div><div style="font-style:italic;margin-top:4px">${esc(YB.fakeMemory)}</div></div>` : ''}
    ${rows.map((r, i) => {
      if (!r.d) return `<div class="card row"><div class="place">–</div><div><div class="team">Team ${r.t}</div><div class="status">Not started</div></div><div></div></div>`;
      const g = r.g, names = String(r.d.names || '').split('|').filter(Boolean).join(' · ');
      const when = r.d.receivedAt ? new Date(r.d.receivedAt).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : '';
      const status = r.d.final ? `Submitted ${when}` : `Still working · last update ${when} · scores appear once they submit`;
      const mem = g.memLocked
        ? (reveal ? `<span class="chip mem ${g.memOk ? 'ok' : 'no'}">Memory: flagged #${g.flagged + 1} ${g.memOk ? '✓ +1' : '✗'}</span>` : `<span class="chip done">Memory: flagged #${g.flagged + 1}</span>`)
        : `<span class="chip">Memory …</span>`;
      const total = g.total + (reveal && g.memOk ? 1 : 0);
      const det = g.rounds.filter(x => x.locked).map(x => `<li><b>${x.label}:</b> ${x.detail.map((ok, j) => `<span class="${ok ? 'r' : 'w'}">${j + 1}${ok ? '✓' : '✗'}</span>`).join(' ')}</li>`).join('');
      return `<div class="card"><div class="row"><div class="place">${i + 1}</div>
        <div><div class="team">Team ${r.t}</div><div class="names">${esc(names)}</div>
          <div class="chips">${g.rounds.map(x => `<span class="chip ${x.locked ? 'done' : ''}">${x.label} ${x.locked ? x.s + '/' + x.n : x.ans + ' of ' + x.n + ' answered'}</span>`).join('')}${mem}</div>
          <div class="status">${status}</div></div>
        <div class="total"><b>${total}</b><span>of ${g.max + 1}</span></div></div>
        ${det ? `<details><summary>Question by question</summary><ul>${det}</ul></details>` : ''}</div>`;
    }).join('')}`;
  document.getElementById('ref').onclick = fetchData;
  document.getElementById('rev').onclick = () => { reveal = !reveal; draw(); };
}

fetchData();
setInterval(() => { if (key && !document.querySelector('details[open]')) fetchData(); }, 15000);
</script>
</body>
</html>
