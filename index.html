<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Yearbook · Winterhouse Season II</title>
<script src="content.js"></script>
<style>
  @font-face { font-family: Vibes; src: url(fonts/GreatVibes-Regular.ttf); font-display: swap; }
  @font-face { font-family: Bebas; src: url(fonts/BebasNeue.woff2) format('woff2'); font-display: swap; }
  @font-face { font-family: Lato; src: url(fonts/Lato-400.woff2) format('woff2'); font-weight: 400; font-display: swap; }
  @font-face { font-family: Lato; src: url(fonts/Lato-400i.woff2) format('woff2'); font-weight: 400; font-style: italic; font-display: swap; }
  @font-face { font-family: Lato; src: url(fonts/Lato-700.woff2) format('woff2'); font-weight: 700; font-display: swap; }
  @font-face { font-family: Lato; src: url(fonts/Lato-900.woff2) format('woff2'); font-weight: 900; font-display: swap; }
  :root { --navy: #01295B; --ink: #172A4D; --blue: #3D97DB; --sky: #86BAF0; --pale: #E3EEFA; --slate: #5E7FA3; --paper: #F7F5F0; --line: #DCE3EC; --ok: #1F8A70; --okbg: #E2F3EE; --bad: #E0574B; --badbg: #FBE9E7; --gold: #3D97DB; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); }
  body { font: 17px/1.45 Lato, -apple-system, Helvetica, Arial, sans-serif; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  main { max-width: 560px; margin: 0 auto; padding: 18px 18px 130px; position: relative; }
  .hd { position: relative; padding: 4px 0 6px; }
  .hd .logo { width: 92px; display: block; }
  .hd .flakes { position: absolute; right: 4px; top: 6px; width: 120px; height: 80px; pointer-events: none; }
  .hd .flakes svg { position: absolute; stroke: var(--sky); }
  .kicker { font-weight: 900; font-size: 13px; letter-spacing: .02em; color: var(--navy); margin-top: 10px; }
  .kicker span { font-weight: 400; color: var(--slate); }
  h1 { font-family: Vibes, cursive; font-weight: 400; font-size: 60px; line-height: 1.1; color: var(--navy); margin: 0 0 2px; }
  .sect { display: flex; align-items: center; gap: 10px; margin: 16px 0 4px; }
  .sect i { flex: 1; height: 8px; background: var(--blue); display: block; border-radius: 1px; }
  .sect b { font-size: 13px; font-weight: 700; color: var(--navy); letter-spacing: .04em; white-space: nowrap; }
  h2 { font-family: Bebas, Impact, sans-serif; font-weight: 400; font-size: 40px; line-height: 1; color: var(--blue); margin: 6px 0 6px; letter-spacing: .01em; }
  .lede { color: var(--slate); margin: 0 0 6px; font-size: 16px; }
  .hint { font-size: 13px; color: var(--slate); font-style: italic; margin: 0 0 16px; }
  .progress { display: flex; gap: 5px; margin: 14px 0 0; }
  .progress span { flex: 1; height: 5px; border-radius: 3px; background: var(--line); }
  .progress span.on { background: var(--navy); }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin: 0 0 16px; box-shadow: 0 2px 8px rgba(1,41,91,.05); }
  .card .num { display: inline-block; font-size: 12px; font-weight: 900; letter-spacing: .06em; color: #fff; background: var(--navy); padding: 3px 9px; border-radius: 4px; margin-bottom: 8px; }
  .card img, .card video { width: 100%; display: block; border-radius: 8px; background: #E9EEF5; }
  .card img { cursor: zoom-in; }
  .card img.zoom { max-height: 360px; object-fit: contain; }
  .q { font-size: 17px; font-weight: 700; color: var(--navy); margin: 10px 2px 8px; }
  .opts { display: grid; gap: 7px; margin-top: 10px; }
  .opts.years { grid-template-columns: repeat(4, 1fr); }
  .opt { font: inherit; font-size: 16px; text-align: left; padding: 10px 12px; border-radius: 8px; border: 0; background: var(--pale); color: var(--navy); cursor: pointer; font-weight: 700; }
  .years .opt { text-align: center; padding: 10px 0; }
  .opt.sel { background: var(--navy); color: #fff; box-shadow: 0 3px 8px rgba(1,41,91,.25); }
  .opt:disabled { cursor: default; }
  .opt.right { outline: 2px solid var(--ok); }
  .locked .opt.sel.right { background: var(--ok); }
  .locked .opt.sel.wrong { background: var(--bad); }
  select { font: inherit; font-weight: 700; color: var(--navy); background: var(--pale); border: 0; border-radius: 8px; padding: 9px 10px; width: 100%; }
  audio { width: 100%; margin-top: 4px; }
  .memory { font: inherit; font-size: 16px; padding: 12px 14px; border-radius: 10px; border: 1.5px solid var(--line); background: #fff; cursor: pointer; margin-bottom: 9px; text-align: left; width: 100%; color: var(--ink); line-height: 1.45; }
  .memory.sel { border-color: var(--bad); background: var(--badbg); }
  .memory .tag { display: block; font-size: 11px; letter-spacing: .08em; color: var(--bad); font-weight: 900; margin-bottom: 3px; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(247,245,240,.96); border-top: 1px solid var(--line); padding: 10px 18px calc(10px + env(safe-area-inset-bottom)); z-index: 20; }
  .bar .in { max-width: 560px; margin: 0 auto; display: flex; gap: 10px; align-items: center; }
  .bar .note { flex: 1; font-size: 14px; color: var(--slate); }
  .btn { font: inherit; font-family: Bebas, Impact, sans-serif; font-size: 22px; letter-spacing: .04em; padding: 10px 20px 8px; border-radius: 8px; border: 0; background: var(--navy); color: #fff; cursor: pointer; }
  .btn.gold { background: var(--blue); }
  .btn:disabled { opacity: .3; }
  .teams { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 10px 0 14px; }
  .teams .opt { text-align: center; font-family: Bebas, Impact, sans-serif; font-size: 30px; font-weight: 400; padding: 8px 0 4px; }
  input.names { width: 100%; font: inherit; font-size: 16px; padding: 11px 12px; border: 1.5px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink); }
  .score { text-align: center; }
  .score .kicker { margin: 0; }
  .score .big { font-family: Bebas, Impact, sans-serif; font-size: 110px; line-height: .9; color: var(--blue); margin: 8px 0 0; }
  table { width: 100%; border-collapse: collapse; font-size: 16px; }
  td { padding: 9px 4px; border-bottom: 1px solid var(--line); }
  td:last-child { text-align: right; font-weight: 900; color: var(--navy); }
  .flag { margin-top: 12px; padding: 10px 12px; border-radius: 8px; font-size: 15px; }
  .flag.ok { background: var(--okbg); color: var(--ok); }
  .flag.no { background: var(--badbg); color: var(--bad); }
  .small { font-size: 13px; color: var(--slate); text-align: center; margin-top: 14px; }
  .reveal { margin-top: 10px; }
  .ft { display: flex; align-items: center; gap: 12px; margin-top: 26px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 10px; font-weight: 900; color: var(--navy); line-height: 1.25; letter-spacing: .04em; }
  .ft img { width: 34px; }
  .ft span { border-left: 1px solid var(--line); padding-left: 10px; }
  .tl { display: grid; gap: 10px; }
  .tlrow { display: flex; align-items: center; gap: 10px; padding: 8px; margin: 0; user-select: none; -webkit-user-select: none; touch-action: pan-y; }
  .tlrow.drag { position: relative; z-index: 5; box-shadow: 0 12px 28px rgba(1,41,91,.28); outline: 2px solid var(--blue); }
  .tlrow .rank { width: 58px; text-align: center; font-family: Bebas, Impact, sans-serif; font-size: 44px; line-height: .9; color: var(--blue); flex: none; }
  .tlrow .rank small { display: block; font-family: Lato, sans-serif; font-size: 10px; font-weight: 900; letter-spacing: .04em; text-transform: uppercase; color: var(--slate); margin-top: 4px; }
  .tlrow img { flex: 1; min-width: 0; height: 140px; object-fit: contain; touch-action: none; cursor: grab; -webkit-user-drag: none; }
  .tlrow .ctl { display: flex; flex-direction: column; align-items: center; gap: 4px; flex: none; }
  .tlrow .mv { font: inherit; font-size: 14px; width: 38px; height: 34px; border-radius: 8px; border: 0; background: var(--pale); color: var(--navy); }
  .tlrow .mv:disabled { opacity: .3; }
  .tlrow .grip { font-size: 22px; color: var(--sky); touch-action: none; cursor: grab; padding: 0 6px; }
  .tlrow.ok { outline: 2px solid var(--ok); background: var(--okbg); }
  .tlrow.no { outline: 2px solid var(--bad); background: var(--badbg); }
  .tlrow .yr { font-family: Bebas, Impact, sans-serif; font-size: 26px; color: var(--navy); }
  .lb { position: fixed; inset: 0; background: rgba(1,22,50,.95); z-index: 100; }
  .lbs { position: absolute; inset: 0; overflow: auto; display: flex; -webkit-overflow-scrolling: touch; }
  .lbs img { margin: auto; max-width: 100%; max-height: 100%; cursor: zoom-in; }
  .lbs img.z { max-width: none; max-height: none; width: 260%; cursor: zoom-out; }
  .lbx { position: absolute; top: calc(10px + env(safe-area-inset-top)); right: 12px; z-index: 2; width: 44px; height: 44px; border-radius: 22px; border: 0; background: rgba(255,255,255,.16); color: #fff; font-size: 28px; line-height: 1; }
  .lbh { position: absolute; left: 0; right: 0; bottom: calc(14px + env(safe-area-inset-bottom)); text-align: center; color: var(--sky); font-size: 13px; pointer-events: none; }
</style>
</head>
<body>
<main id="app"></main>
<div class="bar" id="bar" hidden><div class="in"><span class="note" id="note"></span><button class="btn" id="go"></button></div></div>
<script>
const STEPS = [
  { key: 'timeline', title: 'Class Timeline', lede: 'Drag the photos into order: earliest at the top, most recent at the bottom.' },
  { key: 'rendezvous', title: 'Which Rendezvous?', lede: 'Name the night this photo is from.' },
  { key: 'who', title: 'Who’s in It?', lede: 'It’s pixelated. Name everyone in the photo. One wrong name still counts.' },
  { key: 'zoom', title: 'Zoom In', lede: 'Look closely.' },
  { key: 'hear', title: 'Hear It', lede: 'Listen closely. Ryan shows the videos at the end.' },
  { key: 'caption', title: 'Guess the Caption', lede: 'Only one of these is the real caption.' },
  { key: 'memory', title: 'Whose Memory?', lede: 'Six of these really happened. One was planted by the Traitors. Flag the fake.' }
];
const params = new URLSearchParams(location.search);
if (params.has('reset')) {
  try { Object.keys(localStorage).filter(k => k.startsWith('wh-yearbook-team-')).forEach(k => localStorage.removeItem(k)); } catch (e) {}
  params.delete('reset');
  location.replace(location.pathname + (params.toString() ? '?' + params : ''));
}
let S = { team: params.get('team') || '', names: '', step: -1, ans: {}, locked: {} };
const KEY = () => 'wh-yearbook-team-' + S.team;
function load() { try { const s = JSON.parse(localStorage.getItem(KEY()) || 'null'); if (s) S = s; } catch (e) {} }
function save() { try { localStorage.setItem(KEY(), JSON.stringify(S)); } catch (e) {} }
if (S.team) load();
if (params.has('pilot') && S.team) { S.pilot = true; save(); }
const ENDPOINT = 'https://winterhouse-survey.ryanapanela.workers.dev';
function sync(final) {
  if (!S.team) return Promise.resolve(false);
  return fetch(ENDPOINT + '/yb/save', { method: 'POST', keepalive: true, headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ team: S.team, pilot: !!S.pilot, names: S.names, ans: S.ans, locked: S.locked, step: S.step, final: !!final, sentAt: new Date().toISOString() }) })
    .then(r => r.ok).catch(() => false);
}

const app = document.getElementById('app'), bar = document.getElementById('bar'), note = document.getElementById('note'), go = document.getElementById('go');
const el = (h) => { const t = document.createElement('template'); t.innerHTML = h.trim(); return t.content.firstChild; };
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const FLAKE = (x, y, w) => `<svg style="left:${x}px;top:${y}px" width="${w}" height="${w}" viewBox="-12 -12 24 24" fill="none" stroke-width="1.1" stroke-linecap="round">${[0, 60, 120].map(a => `<g transform="rotate(${a})"><path d="M0-11V11M-3-8 0-5 3-8M-3 8 0 5 3 8"/></g>`).join('')}</svg>`;
function header(sub) {
  return `<header class="hd"><img class="logo" src="logo.png" alt="Winterhouse II"><div class="flakes">${FLAKE(70, 0, 40)}${FLAKE(10, 40, 22)}${FLAKE(100, 52, 20)}</div>
    <div class="kicker">Winterhouse II · Mission 3${S.team ? ` <span>· Team ${esc(S.team)}</span>` : ''}</div><h1>The Yearbook</h1>${sub || ''}</header>`;
}
function footer() {
  return `<div class="ft"><img src="logo.png" alt=""><span>WINTERHOUSE II<br>SEASON II</span><span>THE YEARBOOK<br>MISSION 3</span></div>`;
}
function progress(i) { return `<div class="progress">${STEPS.map((_, j) => `<span class="${j <= i ? 'on' : ''}"></span>`).join('')}</div>`; }

function R(key) { return (key === 'hear') ? YB.hear : (YB.teams[S.team] || YB.teams['1'])[key]; }
function count(key) { return key === 'memory' ? 1 : R(key).length; }
function correct(key, i, v) {
  if (key === 'timeline') return v === R('timeline')[i].a;
  if (key === 'memory') return v === (YB.teams[S.team] || YB.teams['1']).fake;
  if (key === 'who') {
    const truth = R('who')[i].names, picked = new Set((v || []).filter(Boolean));
    const hits = truth.filter(n => picked.has(n)).length;
    return hits >= truth.length - (truth.length >= 3 ? 1 : 0);
  }
  return v === R(key)[i].a;
}
function sectionScore(key) {
  const a = S.ans[key] || {}; let n = 0;
  for (let i = 0; i < count(key); i++) if (a[i] !== undefined && correct(key, i, a[i])) n++;
  return n;
}

function renderStart() {
  bar.hidden = false;
  app.innerHTML = header(`<p class="lede">Five years. One yearbook. Let’s see what you remember.</p>`);
  const c = el(`<div class="card"><div class="q">Which team are you?</div><div class="teams"></div>
    <div class="q" style="margin-top:14px">Who’s on your team?</div>${[0, 1, 2].map(k => `<input class="names" style="margin-bottom:8px" placeholder="Teammate ${k + 1}" value="${esc((S.names || '').split('|')[k] || '')}">`).join('')}</div>`);
  const t = c.querySelector('.teams');
  ['1', '2', '3', '4', '5'].forEach(n => {
    const b = el(`<button class="opt ${S.team === n ? 'sel' : ''}">${n}</button>`);
    b.onclick = () => { const names = [...c.querySelectorAll('input')].map(x => x.value).join('|'); S.team = n; load(); if (S.step < 0) S.names = names; save(); renderStart(); };
    t.appendChild(b);
  });
  c.querySelectorAll('input').forEach(x => x.oninput = () => { S.names = [...c.querySelectorAll('input')].map(y => y.value).join('|'); if (S.team) save(); });
  app.appendChild(c);
  app.appendChild(el(`<div class="card"><div class="q">How it works</div><p style="margin:4px 2px">Seven rounds. Every right answer puts a quarter in the prize pot. Lock in each round when you’re sure, because you can’t go back.</p><p style="margin:4px 2px">The last round hides one fake memory planted by the Traitors. If at least three teams catch it, the best team earns the group a <b>Seer</b>.</p></div>`));
  app.insertAdjacentHTML('beforeend', footer());
  note.textContent = S.team ? '' : 'Pick your team number';
  go.textContent = S.step >= 0 ? 'Continue' : 'Start';
  go.className = 'btn gold';
  go.disabled = !S.team;
  go.onclick = () => { if (S.step < 0) S.step = 0; if (params.has('pilot')) S.pilot = true; save(); sync(false); render(); };
}

function option(key, i, v, label, cls) {
  const a = (S.ans[key] || {})[i], locked = S.locked[key];
  let k = 'opt ' + (cls || '');
  if (a === v) k += ' sel';
  const b = el(`<button class="${k}" ${locked ? 'disabled' : ''}>${esc(label)}</button>`);
  b.onclick = () => { S.ans[key] = S.ans[key] || {}; S.ans[key][i] = v; save(); render(); };
  return b;
}

function renderTimeline(wrap, locked) {
  const items = R('timeline');
  if (!Array.isArray(S.tl) || S.tl.length !== items.length) S.tl = items.map((_, i) => i);
  const setAns = () => { S.ans.timeline = {}; S.tl.forEach((p, pos) => { S.ans.timeline[p] = String(pos + 1); }); save(); };
  if (!locked && !S.ans.timeline) setAns();
  const labels = ['Earliest', '', '', 'Most recent'];
  const list = el('<div class="tl"></div>');
  S.tl.forEach((p, pos) => {
    const it = items[p], cls = locked ? (correct('timeline', p, String(pos + 1)) ? 'ok' : 'no') : '';
    const ctl = locked ? `<span class="yr">${esc(it.year || '')}</span>`
      : `<button class="mv" data-d="-1" ${pos === 0 ? 'disabled' : ''} aria-label="Move up">▲</button><span class="grip">≡</span><button class="mv" data-d="1" ${pos === S.tl.length - 1 ? 'disabled' : ''} aria-label="Move down">▼</button>`;
    list.appendChild(el(`<div class="card tlrow ${cls}" data-p="${p}"><div class="rank">${pos + 1}<small>${labels[pos] || '&nbsp;'}</small></div><img src="${it.img}" alt="" draggable="false">
      <div class="ctl">${ctl}</div></div>`));
  });
  wrap.appendChild(list);
  if (locked) return;
  const commit = () => { S.tl = [...list.children].map(r => +r.dataset.p); setAns(); render(); };
  list.addEventListener('click', e => {
    const b = e.target.closest('.mv'); if (!b) return;
    const pos = [...list.children].indexOf(b.closest('.tlrow')), to = pos + (+b.dataset.d);
    if (to < 0 || to >= S.tl.length) return;
    [S.tl[pos], S.tl[to]] = [S.tl[to], S.tl[pos]]; setAns(); render();
  });
  let drag = null;
  list.addEventListener('pointerdown', e => {
    const h = e.target.closest('img, .grip'); if (!h) return;
    const row = h.closest('.tlrow'); e.preventDefault();
    try { row.setPointerCapture(e.pointerId); } catch (_) {}
    drag = { row, y0: e.clientY, sy: e.clientY, moved: 0, img: e.target.closest('img') }; row.classList.add('drag');
  });
  list.addEventListener('pointermove', e => {
    if (!drag) return; e.preventDefault(); drag.moved = Math.max(drag.moved, Math.abs(e.clientY - drag.sy));
    const row = drag.row; let dy = e.clientY - drag.y0;
    const mid = row.offsetTop + row.offsetHeight / 2 + dy;
    const next = row.nextElementSibling, prev = row.previousElementSibling;
    const before = row.offsetTop;
    if (next && mid > next.offsetTop + next.offsetHeight / 2) list.insertBefore(next, row);
    else if (prev && mid < prev.offsetTop + prev.offsetHeight / 2) list.insertBefore(prev, row.nextSibling);
    drag.y0 += row.offsetTop - before; dy = e.clientY - drag.y0;
    row.style.transform = `translateY(${dy}px)`;
  });
  const end = () => { if (!drag) return; const d = drag; drag = null; d.row.style.transform = ''; d.row.classList.remove('drag'); if (d.moved < 8) { if (d.img) openLB(d.img.src); return; } commit(); };
  list.addEventListener('pointerup', end); list.addEventListener('pointercancel', end);
}

function renderStep() {
  const st = STEPS[S.step], key = st.key, locked = !!S.locked[key];
  app.innerHTML = header() + progress(S.step) + `<div class="sect"><i></i><b>Round ${S.step + 1} of ${STEPS.length}</b></div><h2>${st.title}</h2><p class="lede">${st.lede}</p>${key === 'memory' ? '<div style="height:10px"></div>' : `<p class="hint">${key === 'timeline' ? 'Tap a photo to see it bigger.' : 'Tap any photo to see it bigger.'}</p>`}`;
  const wrap = el(`<div class="${locked ? 'locked' : ''}"></div>`);
  if (key === 'timeline') {
    renderTimeline(wrap, locked);
  } else if (key === 'who') {
    R('who').forEach((it, i) => {
      const cur = ((S.ans.who || {})[i]) || [];
      const c = el(`<div class="card"><div class="num">PHOTO ${i + 1} · ${it.names.length} ${it.names.length === 1 ? 'PERSON' : 'PEOPLE'}</div><img src="${it.img}" alt="" loading="lazy">${it.q ? `<div class="q">${esc(it.q)}</div>` : ''}<div class="opts"></div></div>`);
      it.names.forEach((_, k) => {
        const sel = el(`<select class="opt" ${locked ? 'disabled' : ''}><option value="">Person ${k + 1}…</option>${YB.people.map(p => `<option ${cur[k] === p ? 'selected' : ''}>${p}</option>`).join('')}</select>`);
        sel.onchange = () => {
          const arr = (((S.ans.who || {})[i]) || []).slice(); arr[k] = sel.value;
          S.ans.who = S.ans.who || {}; S.ans.who[i] = arr; save(); render();
        };
        c.querySelector('.opts').appendChild(sel);
      });
      wrap.appendChild(c);
    });
  } else if (key === 'zoom' || key === 'caption' || key === 'rendezvous') {
    R(key).forEach((it, i) => {
      const c = el(`<div class="card"><div class="num">${key === 'zoom' ? 'CLOSE-UP' : 'PHOTO'} ${i + 1}</div><img class="${key === 'zoom' ? 'zoom' : ''}" src="${it.img}" alt="" loading="lazy">${it.q ? `<div class="q">${esc(it.q)}</div>` : ''}<div class="opts"></div></div>`);
      it.o.forEach((o, j) => c.querySelector('.opts').appendChild(option(key, i, j, o)));
      wrap.appendChild(c);
    });
  } else if (key === 'hear') {
    R('hear').forEach((it, i) => {
      const media = it.kind === 'video'
        ? `<video src="${it.src}" controls playsinline preload="metadata"></video>`
        : `<audio src="${it.src}" controls preload="metadata"></audio>`;
      const rev = '';
      const c = el(`<div class="card"><div class="num">CLIP ${i + 1}</div>${media}<div class="q">${esc(it.q)}</div><div class="opts"></div>${rev}</div>`);
      it.o.forEach((o, j) => c.querySelector('.opts').appendChild(option(key, i, j, o)));
      wrap.appendChild(c);
    });
  } else if (key === 'memory') {
    const a = (S.ans.memory || {})[0];
    (YB.teams[S.team] || YB.teams['1']).memories.forEach((m, j) => {
      let cls = 'memory' + (a === j ? ' sel' : '');
      const b = el(`<button class="${cls}" ${locked ? 'disabled' : ''}>${a === j ? '<span class="tag">FLAGGED AS FAKE</span>' : ''}${esc(m)}</button>`);
      b.onclick = () => { S.ans.memory = { 0: j }; save(); render(); };
      wrap.appendChild(b);
    });
  }
  app.appendChild(wrap);
  app.insertAdjacentHTML('beforeend', footer());
  const done = key === 'who'
    ? Object.entries(S.ans.who || {}).filter(([i, v]) => R('who')[i] && v.filter(Boolean).length === R('who')[i].names.length).length
    : Object.keys(S.ans[key] || {}).length, need = count(key);
  if (locked) {
    note.textContent = 'Locked in';
    go.textContent = S.step < STEPS.length - 1 ? 'Next round' : 'See results';
    go.className = 'btn gold'; go.disabled = false;
    go.onclick = () => { S.step++; save(); render(); scrollTo(0, 0); };
  } else {
    note.textContent = `${done} of ${need} answered`;
    go.textContent = 'Lock in'; go.className = 'btn'; go.disabled = done < need;
    go.onclick = () => {
      if (!confirm('Lock in this round? You can’t change your answers after this.')) return;
      S.locked[key] = true; save(); sync(key === 'memory');
      if (key === 'memory') { S.step++; save(); render(); scrollTo(0, 0); } else { render(); scrollTo(0, 0); }
    };
  }
}

function renderEnd() {
  bar.hidden = true;
  const rows = STEPS.filter(s => s.key !== 'memory').map(s => [s.title, sectionScore(s.key), count(s.key)]);
  const flagged = (S.ans.memory || {})[0];
  const total = rows.reduce((a, r) => a + r[1], 0);
  const max = rows.reduce((a, r) => a + r[2], 0);
  app.innerHTML = header(`<p class="lede">${esc((S.names || '').split('|').filter(Boolean).join(' · '))}</p>`) + `
    <div class="card score">
      <div class="kicker">Show this screen to Ryan</div>
      <div class="big">${total}</div>
      <div>out of ${max} so far</div>
    </div>
    <div class="card"><table>${rows.map(r => `<tr><td>${r[0]}</td><td>${r[1]} / ${r[2]}</td></tr>`).join('')}
      <tr><td>Whose Memory?</td><td>Memory ${flagged + 1}</td></tr></table>
      <div class="flag no" style="background:#EEF1F7;color:var(--navy)">You flagged <b>memory ${flagged + 1}</b> as the fake. Ryan reveals the truth once every team is done, and it’s worth one more quarter if you’re right.</div>
    </div>
    <p class="small">Team ${esc(S.team)} · finished ${new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}</p>
    <p class="small" id="sent">Sending your answers to Ryan…</p>` + footer();
  sync(true).then(ok => { const e = document.getElementById('sent'); if (e) e.textContent = ok ? 'Sent to Ryan ✓' : 'Couldn’t reach Ryan’s scoreboard. Show him this screen.'; });
}

function render() {
  if (S.step < 0 || !S.team) return renderStart();
  bar.hidden = false;
  if (S.step >= STEPS.length) return renderEnd();
  renderStep();
}
function openLB(src) {
  const o = el(`<div class="lb"><div class="lbs"><img src="${src}" alt=""></div><button class="lbx" aria-label="Close">×</button><div class="lbh">Tap the photo to zoom in · tap outside to close</div></div>`);
  document.body.appendChild(o); document.body.style.overflow = 'hidden';
  const sc = o.querySelector('.lbs'), im = o.querySelector('img');
  const close = () => { o.remove(); document.body.style.overflow = ''; };
  im.onclick = e => {
    e.stopPropagation();
    const r = im.getBoundingClientRect(), fx = (e.clientX - r.left) / r.width, fy = (e.clientY - r.top) / r.height;
    const z = im.classList.toggle('z');
    if (z) requestAnimationFrame(() => { sc.scrollLeft = fx * im.offsetWidth - sc.clientWidth / 2; sc.scrollTop = fy * im.offsetHeight - sc.clientHeight / 2; });
  };
  sc.onclick = close; o.querySelector('.lbx').onclick = close;
}
app.addEventListener('click', e => { const im = e.target.closest('.card img'); if (!im || im.closest('.tlrow')) return; openLB(im.src); });
render();
</script>
</body>
</html>
